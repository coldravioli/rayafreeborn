<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>F.I.H. | CHAT_INTERFACE</title>
    <link rel="stylesheet" href="sexy.css">
    <style>
        body {
            background: black;
            color: var(--terminal-green);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2vw 4vw;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        #output::-webkit-scrollbar { display: none; }

        #output p { margin: 8px 0; line-height: 1.4; }
        
        .bot { color: var(--terminal-green); }
        .user { color: #ffffff; font-weight: bold; }
        .loading { font-style: italic; opacity: 0.5; margin: 10px 0; }

        .choices, .nav-wrapper {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .choice-btn {
            background: transparent;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 8px 16px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .choice-btn:hover {
            background: rgba(24, 237, 0, 0.1);
            box-shadow: 0 0 10px var(--terminal-green);
        }

        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(24, 237, 0, 0.2);
            padding: 20px 0;
        }

        #input {
            background: transparent;
            border: none;
            color: var(--terminal-green);
            font-family: inherit;
            font-size: 1.2rem;
            width: 100%;
            outline: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div class="chat-header">
        <div class="neon-png">F.I.H. // CHAT_ASSISTANT</div>
        <div>STATUS: <span style="color: var(--fih-purple);">CONNECTED_AS_<span id="user-display">VISITOR</span></span></div>
        <a href="website.html" class="terminate-btn">X</a>
    </div>

    <div id="chat-container">
        <div id="output" class="neon-png"></div>
      
        <div id="input-line">
          <span class="prompt-symbol">>></span>
          <input id="input" type="text" autocomplete="off" autofocus />
        </div>
    </div>

    <script>
        // --- YOUR ORIGINAL JS LOGIC INTEGRATED ---
        const savedName = sessionStorage.getItem("fihUser") || "visitor";
        const userName = savedName;
        document.getElementById('user-display').innerText = userName.toUpperCase();

        let awaitingSignature = false;
        let failedAttempts = 0;
        const output = document.getElementById("output");
        const input = document.getElementById("input");
        let audioCtx;

        function playBeep() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = "square";
            osc.frequency.setValueAtTime(800 + Math.random() * 200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        function addLine(text, className = "bot", speed = 20) {
            const line = document.createElement("p");
            line.className = className;
            output.appendChild(line);
            let i = 0;
            function typeChar() {
                if (i < text.length) {
                    line.textContent += text.charAt(i);
                    i++;
                    if (className === "bot") playBeep();
                    output.scrollTop = output.scrollHeight;
                    setTimeout(typeChar, speed);
                }
            }
            typeChar();
        }

        function addUserLine(text) {
            const line = document.createElement("p");
            line.className = "user";
            line.textContent = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function addThinkingLine(finalText, className = "bot") {
            const line = document.createElement("p");
            line.className = className;
            output.appendChild(line);
            const dots = "...";
            let i = 0;
            function typeDots() {
                if (i < dots.length) {
                    line.textContent += dots.charAt(i);
                    playBeep();
                    i++;
                    output.scrollTop = output.scrollHeight;
                    setTimeout(typeDots, 450);
                } else {
                    setTimeout(() => typeRest(finalText), 900);
                }
            }
            function typeRest(text) {
                let j = 0;
                function typeChar() {
                    if (j < text.length) {
                        line.textContent += text.charAt(j);
                        playBeep();
                        j++;
                        output.scrollTop = output.scrollHeight;
                        setTimeout(typeChar, 20);
                    }
                }
                typeChar();
            }
            typeDots();
        }

        function showNavigationButton(label, hash) {
            const wrapper = document.createElement("div");
            wrapper.className = "nav-wrapper";
            const btn = document.createElement("button");
            btn.textContent = label;
            btn.className = "choice-btn";
            btn.addEventListener("click", () => { window.location.href = "store.html#" + hash; });
            wrapper.appendChild(btn);
            output.appendChild(wrapper);
        }

        function fakeLoading(callback) {
            const phrases = ["Loading...", "Interpreting request...", "Processing..."];
            const text = phrases[Math.floor(Math.random() * phrases.length)];
            const line = document.createElement("p");
            line.className = "loading";
            line.textContent = text;
            output.appendChild(line);
            setTimeout(() => { line.remove(); callback(); }, 800 + Math.random() * 1000);
        }

        function showChoices(options) {
            const wrapper = document.createElement("div");
            wrapper.className = "choices";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.textContent = opt;
                btn.className = "choice-btn";
                btn.addEventListener("click", () => {
                    addUserLine(">> " + opt);
                    wrapper.remove();
                    handleResponse(opt.toLowerCase());
                });
                wrapper.appendChild(btn);
            });
            output.appendChild(wrapper);
        }

        function handleSignature(value) {
            const sig = value.trim().toLowerCase();
            const exp = userName.trim().toLowerCase();
            awaitingSignature = false;
            if (sig === exp) {
                addLine("Signature verified.", "bot");
                setTimeout(() => {
                    addLine("Access granted.", "bot");
                    showNavigationButton("Enter freshwater inventory", "freshwater");
                }, 800);
            } else {
                failedAttempts++;
                addLine("Signature mismatch.", "bot");
                setTimeout(() => {
                    addLine("Identity could not be confirmed.", "bot");
                    showChoices(["Retry Verification", "Abort"]);
                }, 1000);
            }
        }

        function handleResponse(inputText) {
            // Check for Buy/Fish/Yes first to avoid the "do not understand" bug
            if (
                inputText.includes("buy") || 
                inputText.includes("fish") || 
                inputText.includes("specimen") || 
                inputText.includes("yes") ||
                inputText.includes("store")
            ) {
                fakeLoading(() => {
                    addLine(`Only freshwater specimens are available, ${userName}.`, "bot");
                    setTimeout(() => {
                        addLine("Before proceeding, verification is required.", "bot");
                        showChoices(["Proceed"]);
                    }, 700);
                });
            } else if (inputText.includes("hello") || inputText.includes("hi")) {
                fakeLoading(() => {
                    addLine(`Hello, ${userName}. Are you interested in purchasing fish?`, "bot");
                });
            } else if (inputText.includes("what is")) {
                fakeLoading(() => {
                    addLine("F.I.H. stands for Future Ichthyoid Habitation.", "bot");
                    setTimeout(() => {
                        addLine("F.I.H. specializes in the collection and homing of advanced specimens originating in the New River.", "bot");
                    }, 800);
                });
            } else if (inputText === "proceed") {
                fakeLoading(() => {
                    addLine("Do you understand that all specimens require environmental maintenance?", "bot");
                    showChoices(["I Understand", "I Do Not"]);
                });
            } else if (inputText === "i understand") {
                fakeLoading(() => {
                    addLine("Do you agree to assume responsibility for specimen behavior?", "bot");
                    showChoices(["I Agree", "I Refuse"]);
                });
            } else if (inputText === "i agree") {
                fakeLoading(() => {
                    addLine("Final verification required. Type your name to sign authorization.", "bot");
                    awaitingSignature = true;
                });
            } else if (inputText === "retry verification") {
                addLine("Re-enter signature exactly as registered.", "bot");
                awaitingSignature = true;
            } else if (inputText === "abort" || inputText === "i do not" || inputText === "i refuse") {
                addLine("Request terminated. Session flagged.", "bot");
            } else {
                fakeLoading(() => {
                    addThinkingLine("I don't understand. Do you want to purchase fish?", "bot");
                });
            }
        }

        // INITIAL BOOT
        addLine("F.I.H. SYSTEM ONLINE...", "bot");
        setTimeout(() => {
            addLine(`Hello, ${userName}. How may I help you today?`, "bot");
        }, 800);

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const val = input.value.trim();
                if (!val) return;
                input.value = "";
                addUserLine(">> " + val);
                if (awaitingSignature) handleSignature(val);
                else handleResponse(val.toLowerCase());
            }
        });

        document.addEventListener('click', () => input.focus());
    </script>
</body>
</html>
