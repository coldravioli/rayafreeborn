<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>F.I.H. | ACCESS_PORTAL</title>
    <link rel="stylesheet" href="sexy.css">
    <style>
        body {
            background: black;
            color: var(--terminal-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .portal-container {
            text-align: center;
            z-index: 10;
        }

        /* Terminal Text Styling */
        .terminal-text {
            font-size: 1.5rem;
            height: 2rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--terminal-green);
        }

        .terminal-text::after {
            content: "_";
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        #nameInput {
            background: transparent;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 12px;
            font-family: inherit;
            text-align: center;
            width: 250px;
            outline: none;
            text-transform: uppercase;
        }

        #enterButton {
            background: transparent;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 10px 30px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
        }

        #enterButton:hover {
            background: var(--terminal-green);
            color: black;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div class="portal-container">
        <!-- THE TERMINAL LOOP ELEMENT -->
        <div class="terminal-text"></div>

        <div class="input-group">
            <input type="text" id="nameInput" placeholder="ENTER_CREDENTIALS" autocomplete="off">
            <button id="enterButton">INITIALIZE_SESSION</button>
        </div>
    </div>

    <script>
        const texts = ["identify.", "stabilize.", "redistribute.", "welcome to f.i.h."];
        const terminalElement = document.querySelector(".terminal-text");
        const nameInput = document.getElementById("nameInput");
        const enterButton = document.getElementById("enterButton");

        let currentTextIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        // ================= TERMINAL TYPING LOOP =================
        function handleTerminal() {
            const currentFullText = texts[currentTextIndex];

            if (!isDeleting) {
                terminalElement.innerText = currentFullText.substring(0, charIndex + 1);
                charIndex++;

                if (charIndex === currentFullText.length) {
                    isDeleting = true;
                    setTimeout(handleTerminal, 1500);
                } else {
                    setTimeout(handleTerminal, 80);
                }
            } else {
                terminalElement.innerText = currentFullText.substring(0, charIndex - 1);
                charIndex--;

                if (charIndex === 0) {
                    isDeleting = false;
                    currentTextIndex = (currentTextIndex + 1) % texts.length;
                    setTimeout(handleTerminal, 500);
                } else {
                    setTimeout(handleTerminal, 50);
                }
            }
        }

        // ================= BUTTON & FLASH LOGIC =================
        enterButton.addEventListener("click", () => {
            const nameValue = nameInput.value.trim();

            if (nameValue !== "") {
                // Flash effect
                enterButton.disabled = true;
                enterButton.innerText = "INITIALIZING...";
                enterButton.style.backgroundColor = "#ffffff";
                enterButton.style.color = "#000000";

                // SAVE NAME
                sessionStorage.setItem("fihUser", nameValue);

                // Redirect
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1000);

            } else {
                nameInput.style.borderColor = "red";
                setTimeout(() => { nameInput.style.borderColor = "#00ff00"; }, 500);
            }
        });

        // ================= ENTER KEY =================
        nameInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                enterButton.click();
            }
        });

        // ================= START =================
        window.onload = handleTerminal;
    </script>
</body>
</html>
